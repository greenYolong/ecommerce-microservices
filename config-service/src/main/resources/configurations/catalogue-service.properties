spring.application.name=catalogue-service
server.port=8081

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/catalogue_db}
spring.datasource.username=${DB_USER:catalogue_user}
spring.datasource.password=${DB_PASSWORD:catalogue_pwd}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
