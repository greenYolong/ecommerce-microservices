networks:
  ecommerce-net:
    driver: bridge

volumes:
  catalogue-db-data:
  commande-db-data:
  paiement-db-data:

services:

  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    image: discovery-service:1.0
    container_name: discovery-service
    networks:
      - ecommerce-net
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  config-service:
    build:
      context: ./config-service
      dockerfile: Dockerfile
    image: config-service:1.0
    container_name: config-service
    networks:
      - ecommerce-net
    ports:
      - "8888:8888"
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  catalogue-db:
    image: postgres:17
    container_name: catalogue-db
    networks:
      - ecommerce-net
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: catalogue_db
      POSTGRES_USER: catalogue_user
      POSTGRES_PASSWORD: catalogue_pwd
    volumes:
      - catalogue-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue_user -d catalogue_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  commande-db:
    image: postgres:17
    container_name: commande-db
    networks:
      - ecommerce-net
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: commande_db
      POSTGRES_USER: commande_user
      POSTGRES_PASSWORD: commande_pwd
    volumes:
      - commande-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commande_user -d commande_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  paiement-db:
    image: postgres:17
    container_name: paiement-db
    networks:
      - ecommerce-net
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: paiement_db
      POSTGRES_USER: paiement_user
      POSTGRES_PASSWORD: paiement_pwd
    volumes:
      - paiement-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paiement_user -d paiement_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  catalogue-service:
    build:
      context: ./catalogue-service
      dockerfile: Dockerfile
    image: catalogue-service:1.0
    container_name: catalogue-service
    restart: on-failure
    networks:
      - ecommerce-net
    ports:
      - "8081:8081"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      CONFIG_URL: http://config-service:8888
      DB_URL: jdbc:postgresql://catalogue-db:5432/catalogue_db
      DB_USER: catalogue_user
      DB_PASSWORD: catalogue_pwd
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      catalogue-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  commande-service:
    build:
      context: ./commande-service
      dockerfile: Dockerfile
    image: commande-service:1.0
    container_name: commande-service
    restart: on-failure
    networks:
      - ecommerce-net
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      CONFIG_URL: http://config-service:8888
      DB_URL: jdbc:postgresql://commande-db:5432/commande_db
      DB_USER: commande_user
      DB_PASSWORD: commande_pwd
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      commande-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  paiement-service:
    build:
      context: ./paiement-service
      dockerfile: Dockerfile
    image: paiement-service:1.0
    container_name: paiement-service
    restart: on-failure
    networks:
      - ecommerce-net
    ports:
      - "8083:8083"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      CONFIG_URL: http://config-service:8888
      DB_URL: jdbc:postgresql://paiement-db:5432/paiement_db
      DB_USER: paiement_user
      DB_PASSWORD: paiement_pwd
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      paiement-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    image: gateway-service:1.0
    container_name: gateway-service
    restart: on-failure
    networks:
      - ecommerce-net
    ports:
      - "9000:9000"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      CONFIG_URL: http://config-service:8888
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      catalogue-service:
        condition: service_healthy
      commande-service:
        condition: service_healthy
      paiement-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
